# Production-style stack: Postgres + API (migrates on start) + web (nginx, proxies /api to the API).
#   cp .env.example .env   # then edit the secrets
#   docker compose up -d --build
#   docker compose --profile judge0 up -d     # optional: sandboxed code execution for coding questions
services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: proctorai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: proctorai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proctorai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        WITH_AI: ${WITH_AI:-false}
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://proctorai:${POSTGRES_PASSWORD}@database:5432/proctorai
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost:8080}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Platform Owner}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-ProctorAI <no-reply@proctorai.local>}
      REDIS_URL: ${REDIS_URL:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      AI_PROCTORING_ENABLED: ${AI_PROCTORING_ENABLED:-true}
      JUDGE0_URL: ${JUDGE0_URL:-http://judge0-server:2358}
    volumes:
      - evidence_data:/data/evidence
    depends_on:
      database:
        condition: service_healthy
    # not published: only the web container reaches it

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend

  # ---------------------------------------------------------------------------
  # Judge0: sandboxed code execution for coding questions. OPTIONAL.
  # Not published to the host; only the backend can reach it. Change the passwords in judge0.conf.
  # ---------------------------------------------------------------------------
  judge0-server:
    image: judge0/judge0:1.13.1
    profiles: ["judge0"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true   # required by Judge0's isolate sandbox
    restart: always
    depends_on: [judge0-db, judge0-redis]

  judge0-worker:
    image: judge0/judge0:1.13.1
    profiles: ["judge0"]
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    depends_on: [judge0-db, judge0-redis]

  judge0-db:
    image: postgres:16.2
    profiles: ["judge0"]
    env_file: judge0.conf
    volumes:
      - judge0_data:/var/lib/postgresql/data/
    restart: always

  judge0-redis:
    image: redis:7.2.4
    profiles: ["judge0"]
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    restart: always

volumes:
  postgres_data:
  evidence_data:
  judge0_data:
