server {
    listen 80;
    server_name _;
    client_max_body_size 4m;              # webcam frames / ID photos arrive as base64 JSON

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Camera/microphone are needed by the exam room; everything else is off.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()" always;

    # API: /api/x  ->  backend /x
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 70s;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;   # React Router
    }
}
