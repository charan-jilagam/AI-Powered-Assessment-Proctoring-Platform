# Settings for the Judge0 code-execution engine used by coding questions.
# Judge0 is NOT published to the host; only the backend container talks to it.
# Reference of every option: https://github.com/judge0/judge0/blob/master/judge0.conf
#
# !! CHANGE BOTH PASSWORDS before using this anywhere real. !!

# Don't phone home (Judge0 telemetry is on by default).
JUDGE0_TELEMETRY_ENABLE=false

# Service names from docker-compose.yml
REDIS_HOST=judge0-redis
REDIS_PASSWORD=change-me-redis
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=change-me-postgres

# Candidate programs must never reach the network.
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

# Optional: require a token on every Judge0 call. If you enable this, also set
# JUDGE0_AUTH_TOKEN (and JUDGE0_AUTH_HEADER if you rename the header) on the backend.
# AUTHN_HEADER=X-Auth-Token
# AUTHN_TOKEN=some-long-random-string

# Optional: number of parallel judging workers per worker container
# (default 2*nproc). You can also run more containers:
#   docker compose --profile judge0 up -d --scale judge0-worker=3
# COUNT=4
