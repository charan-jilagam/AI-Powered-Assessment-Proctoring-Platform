name: Keep ORVEXA awake

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may delay runs a little)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake and check the service
        run: |
          URL="https://orvexa.onrender.com/health/live"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Service did not answer with 200"
          exit 1
