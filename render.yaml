# Render Blueprint: one Docker web service (API + frontend). Secrets are NOT stored here; Render asks for them
# (sync: false) when you create the Blueprint, or you add them under Environment in the dashboard.
services:
  - type: web
    name: orvexa
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter            # free works for a demo but sleeps; starter keeps the exam sweeper running
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: orvexa
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: FRONTEND_URL          # your public URL, e.g. https://orvexa.onrender.com (no trailing slash)
        sync: false
      - key: CORS_ORIGINS          # same URL; the frontend is same-origin so this is only a safety net
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_URL        # cloudinary://API_KEY:API_SECRET@CLOUD_NAME
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST             # optional: without it e-mails are only stored in the outbox
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: BREVO_API_KEY         # recommended on Render: SMTP is blocked on the free tier, Brevo/Resend use HTTPS
        sync: false
      - key: RESEND_API_KEY        # alternative to Brevo
        sync: false
      - key: MAIL_FROM             # must be a sender/domain verified with your mail provider
        value: ORVEXA <no-reply@yourdomain.com>
      - key: STAFF_EMAIL_VERIFICATION      # admins must verify their e-mail before creating tests
        value: "true"
      - key: CANDIDATE_EMAIL_VERIFICATION  # candidates enter a 6-digit e-mailed code before joining
        value: "true"
      - key: CODE_RUNNER           # auto = Judge0 if JUDGE0_URL is set, otherwise the built-in runner
        value: auto
      - key: JUDGE0_URL            # optional: self-hosted Judge0 (recommended for high-stakes coding exams)
        sync: false
      - key: JUDGE0_EXTRA_HEADERS  # optional JSON, e.g. {"X-RapidAPI-Key":"...","X-RapidAPI-Host":"judge0-ce.p.rapidapi.com"}
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
